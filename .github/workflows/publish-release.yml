name: "Publish Release"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Название тэга (например release-16-04-2025)'
        required: true

jobs:
  publish-release:
    name: Create Tag & Trigger Module Publishes
    runs-on: macos-latest
    environment: sdds
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x ./scripts/install_certificate_and_profile.sh
          ./scripts/install_certificate_and_profile.sh "$RUNNER_TEMP" "$BUILD_CERTIFICATE_BASE64" "$P12_PASSWORD" "$BUILD_PROVISION_PROFILE_BASE64" "$KEYCHAIN_PASSWORD"

      - name: Computed envs
        run: |
          DATE=$(date +'%d.%m.%Y')
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "FROM_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Retrieve tag exists flag
        uses: mukunku/tag-exists-action@v1.0.0
        id: checkTag
        with:
          tag: ${{ github.event.inputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify tag not exists
        run: |
          if [ ${{ steps.checkTag.outputs.exists }} == true ]; then exit 1; else exit 0; fi

      - name: Create and push tag
        run: |
          git config --global user.email "salutedevs@gmail.com"
          git config --global user.name "Salute iOS Team"

          git tag -a $TAG -m "Release $TAG"
          git push origin $TAG
        env:
          TAG: ${{ github.event.inputs.tag_name }}

      - name: Create Release on GitHub
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: ${{ github.event.inputs.tag_name }}
          draft: true
          prerelease: false

      - name: Install Ruby dependencies
        run: |
          bundle install

      - name: Build artifacts
        run: |
          ruby scripts/build_xcframeworks.rb -d SDDSThemeBuilder -p SDDSThemeBuilder.xcodeproj -m SDDSThemeCore
          if [ ! -d "SDDSThemeBuilder/build/SDDSThemeCore.xcframework" ]; then
            echo "❌ SDDSThemeCore.xcframework was not created at SDDSThemeBuilder/build"
            exit 1
          fi
          ruby scripts/build_xcframeworks.rb -d . -w SDDS.xcworkspace
          ruby scripts/build_themes.rb

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ -d "build" ]; then cp -R "build" "artifacts/build"; fi
          if [ -d "Themes/build" ]; then cp -R "Themes/build" "artifacts/themes-build"; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
          retention-days: 30

      - name: Build ThemeBuilder CLI
        run: |
          cd SDDSThemeBuilder
          ./build_cli.sh
          test -x build/themebuilder/SDDSThemeBuilder || { echo "❌ CLI binary not built"; exit 1; }

      - name: Package ThemeBuilder CLI
        env:
          TAG: ${{ github.event.inputs.tag_name }}
        run: |
          cd SDDSThemeBuilder/build
          rm -rf SDDSThemeBuilder-cli && mkdir -p SDDSThemeBuilder-cli
          cp -R themebuilder/SDDSThemeBuilder themebuilder/SDDSThemeBuilderCore.framework SDDSThemeBuilder-cli/
          test -f ../.sdds/ios-api-meta.json || { echo "❌ styles API meta not generated"; exit 1; }
          cp ../.sdds/ios-api-meta.json SDDSThemeBuilder-cli/
          ditto -c -k --sequesterRsrc --keepParent SDDSThemeBuilder-cli "SDDSThemeBuilder-cli-${TAG}.zip"

      - name: Upload ThemeBuilder CLI to release
        env:
          TAG: ${{ github.event.inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload "${TAG}" "SDDSThemeBuilder/build/SDDSThemeBuilder-cli-${TAG}.zip" --clobber

      # Архив исходников, из которых CLI собирает standalone-бандл. С ним клиенту не
      # нужен доступ к репозиторию: `--standalone --sources-version <tag>`.
      - name: Package SDDS sources archive
        env:
          TAG: ${{ github.event.inputs.tag_name }}
        run: |
          chmod +x scripts/package_sources.sh
          ./scripts/package_sources.sh "${TAG}"
          test -f "build/SDDSSources-${TAG}.zip" || { echo "❌ sources archive not built"; exit 1; }

      - name: Upload SDDS sources archive to release
        env:
          TAG: ${{ github.event.inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload "${TAG}" "build/SDDSSources-${TAG}.zip" --clobber

      - name: Determine changed modules
        id: changed
        run: |
          scripts/changed-modules.sh "${{ env.FROM_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Dispatch publish workflows for changed modules
        if: steps.changed.outputs.modules != ''
        run: |
          chmod +x scripts/dispatch-publish.sh
          scripts/dispatch-publish.sh "${{ steps.changed.outputs.modules }}" "${{ github.event.inputs.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 

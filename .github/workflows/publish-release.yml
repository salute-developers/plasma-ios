name: "Publish Release"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Название тэга (например release-01-09-2026)'
        required: true
      dry_run:
        description: 'Только собрать ассеты (без тега и релиза). Можно запускать с любой ветки.'
        type: boolean
        required: false
        default: false

# Один прогон: сборка всех ассетов → тег → draft-релиз → upload → снятие draft.
# Сборка идёт первой, поэтому упавший билд не оставляет ни тега, ни релиза.
jobs:
  publish-release:
    name: Build artifacts & publish release
    # macos-latest = macOS 26 без Xcode 16.x; образ и Xcode закреплены явно, Xcode = локальному 26.6.
    runs-on: macos-26
    # Публикация идёт через окружение release: required reviewers (владельцы), джоба ждёт
    # одобрения перед стартом. dry_run ничего не создаёт, поэтому идёт через sdds без
    # одобрения. На sdds стоят PR-сборки — reviewers там заблокировали бы весь CI.
    environment: ${{ inputs.dry_run && 'sdds' || 'release' }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag_name }}
      # Встроенный токен джобы: contents: write хватает на тег, релиз и ассеты. PAT не нужен —
      # на теги/релизы больше не подписан ни один воркфлоу, так что «GITHUB_TOKEN не триггерит
      # другие воркфлоу» ничего не ломает.
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Verify tag does not exist
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

      - name: Install Ruby dependencies
        run: bundle install

      - name: Build release artifacts
        run: scripts/release/build_release.sh "${TAG}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 30

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run — тег и релиз не создаются, ассеты лежат в Actions-артефакте release-artifacts"

      # Предыдущий release-тег считаем до создания нового — от него строится changelog.
      - name: Compute previous release tag
        if: ${{ !inputs.dry_run }}
        run: |
          FROM_TAG=$(git describe --tags --abbrev=0 --match 'release-*' 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          echo "FROM_TAG=$FROM_TAG" >> "$GITHUB_ENV"
          echo "Changelog range: $FROM_TAG..HEAD"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        run: |
          # Локальный конфиг клона: глобальный конфиг машины не трогаем.
          git config user.email "salutedevs@gmail.com"
          git config user.name "Salute iOS Team"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Build changelog
        id: changelog
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: ./.github/actions/release-changelog
        with:
          fromTag: ${{ env.FROM_TAG }}
          toTag: ${{ github.event.inputs.tag_name }}

      # Заметки релиза: сгенерированный GitHub список PR («What's Changed») всегда; сверху —
      # наш changelog по компонентам, если release-changelog его собрал (PR без шаблона
      # «### What/why changed» дают пустой результат — тогда только --generate-notes).
      - name: Create draft release
        if: ${{ !inputs.dry_run }}
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "${CHANGELOG}" > "$NOTES"
          # Инструкция по запуску демо на симуляторе едет в каждый релиз — так же, как
          # apk-installation-instructions на Android.
          if [ -f .github/templates/simulator-app-instructions.md ]; then
            printf '\n---\n\n' >> "$NOTES"
            cat .github/templates/simulator-app-instructions.md >> "$NOTES"
          fi
          if grep -qE '[^[:space:]]' "$NOTES"; then
            gh release create "${TAG}" --draft --title "${TAG}" --notes-file "$NOTES" --generate-notes
          else
            echo "::notice::changelog по компонентам пуст, в релизе только автосгенерированные заметки"
            gh release create "${TAG}" --draft --title "${TAG}" --generate-notes
          fi

      - name: Upload assets to release
        if: ${{ !inputs.dry_run }}
        run: gh release upload "${TAG}" release-artifacts/* --clobber

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        run: gh release edit "${TAG}" --draft=false

      # release-manifest.json is what client sync scripts read. Regenerate it from the
      # release that was just published, so it can never claim a version or URL that was
      # not actually shipped. A protected branch may reject the push — that must not fail
      # an already published release, hence continue-on-error.
      - name: Update release manifest
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -euo pipefail
          bundle exec ruby scripts/release/update_release_manifest.rb "${TAG}"
          if git diff --quiet -- release-manifest.json; then
            echo "release-manifest.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json
          git commit -m "chore(sdds-ios/build-system): update release manifest for ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::warning::Could not push the updated release-manifest.json. Run 'ruby scripts/release/update_release_manifest.rb ${TAG}' locally and open a PR."
            exit 1
          }

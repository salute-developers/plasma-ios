name: Update Icons Pack

on:
  workflow_dispatch:
    inputs:
      plasma-ref:
        required: true
        default: master
      plasma-version:
        required: true
      checkout-branch:
        required: false
        default: main
  repository_dispatch:
    types: [ build-icons ]

jobs:
  icons:
    runs-on: macos-latest
    environment: sdds
    env:
        lerna-scope: '--scope="@salutejs/plasma-icons"'

    steps:
      # Checkout в текущем репозитории
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout-branch || 'main' }}
          show-progress: false
          fetch-depth: 0
          path: current
          submodules: recursive

      # Checkout репозитория plasma
      - name: Checkout to Plasma Web
        uses: actions/checkout@v4
        with:
          repository: salute-developers/plasma
          ref: ${{ github.event.client_payload.ref || github.event.inputs.plasma-ref }}
          show-progress: false
          path: plasma
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: 'plasma/.nvmrc'

      # Голый `npm ci` в plasma не работает: он дёргает `prepare` всех воркспейсов
      # в произвольном порядке, и @salutejs/core-themes собирается раньше, чем
      # @salutejs/plasma-tokens-utils сгенерит lib/ (TS2307). Штатная установка в
      # plasma — только через их же скрипт: `npm ci --ignore-scripts && patch-package`.
      # Сборка воркспейсов (setup:packages) нам не нужна: generate:ios — это обычный
      # node-скрипт по ./src, он не зависит от build-артефактов пакетов.
      - name: Install plasma web project deps
        working-directory: ./plasma
        run: |
          npm run setup:deps:ci
          # sharp@0.32 забирает бинарь libvips в install-скрипте, который съедается
          # флагом --ignore-scripts; без rebuild generate:ios упадёт на require('sharp').
          npm rebuild sharp

      # `lerna bootstrap` удалён в lerna 7+ (в plasma сейчас 9.x), а сама установка
      # уже сделана шагом выше. Фильтры в lerna 7+ идут после команды.
      - name: Generate iOS icons
        working-directory: ./plasma
        run: |
          npx lerna run generate:ios ${{ env.lerna-scope }}

      - name: Bump version
        working-directory: ./current
        run: |
          ruby ./scripts/bump_version.rb ./SDDSIcons/info.plist

      - name: Extract new version
        id: extract_version
        working-directory: ./current
        shell: bash
        run: |
          VER=$(grep -A1 'CFBundleShortVersionString' ./SDDSIcons/info.plist | awk -F'[<>]' '/string/{print $3; exit}')
          echo "CFBundleVersion is $VER"
          echo "tag=SDDSIcons-v$VER" >> $GITHUB_OUTPUT
          
      - name: Verify release branch not exists
        working-directory: ./current
        shell: bash
        run: |
          git fetch --all
          if git branch -a | grep -q release/${{ steps.extract_version.outputs.tag }}; then exit 1; else exit 0; fi
          
      - name: Create release branch
        working-directory: ./current
        shell: bash
        run: |
          git fetch --all
          git checkout -b release/${{steps.extract_version.outputs.tag}}
          
      - name: Move generated icons to XCAssets
        run: cp -rf plasma/packages/plasma-icons/icons-ios/. current/SDDSIcons/SDDSIcons/Assets.xcassets
        
      - name: Install SwiftGen
        run: |
           brew install swiftgen
           
      - name: Run SwiftGen
        working-directory: ./current
        run: |
           cd SDDSIcons
           swiftgen

      # ./current чекаутится из `main` (у repository_dispatch нет inputs), а скрипт
      # добавлен только в develop — пока его там нет, шаг пропускаем, а не падаем.
      - name: Verify generated icon names
        working-directory: ./current
        shell: bash
        run: |
          if [ -f ./SDDSIcons/Scripts/verify_icons.rb ]; then
            ruby ./SDDSIcons/Scripts/verify_icons.rb
          else
            echo "::warning::SDDSIcons/Scripts/verify_icons.rb not found in ${{ github.event.inputs.checkout-branch || 'main' }}, skipping icon name verification"
          fi

      - name: Create tag and release pull request
        working-directory: ./current
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${{steps.extract_version.outputs.tag}}
          PLASMA_VER=${{ github.event.client_payload.version || github.event.inputs.plasma-version }}
          git config --local user.email "salutedevs@gmail.com"
          git config --local user.name "Salute iOS Team"
          git add ./SDDSIcons/SDDSIcons/Assets.xcassets/
          git add ./SDDSIcons/Generated/Assets.swift
          git add ./SDDSIcons/info.plist
          git commit -m "feat(sdds-acore/icons): New icons were added from plasma v$PLASMA_VER"
          git push --set-upstream origin release/$TAG
          gh pr create --base main --head release/$TAG --title "Release $TAG" --body "Icons were updated to v$PLASMA_VER"

name: Bug report
description: Something in the components, themes or the CLI does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in as much as you can —
        a minimal reproduction is worth more than a long description.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the design system is affected?
      options:
        - Buttons (Button, ButtonGroup, IconButton, LinkButton)
        - Inputs (TextField, TextArea, CodeField, CodeInput, Autocomplete, Select, Editable, Wheel)
        - Selection controls (Checkbox, Radiobox, Switch, Segment, Chip)
        - Navigation (NavigationBar, Tabs, TabBar, Toolbar, DropdownMenu, PaginationDots)
        - Feedback (Toast, Notification, Note, Tooltip, Popover, Modal, BottomSheet, Drawer)
        - Layout (Card, Cell, List, Divider, Carousel, Accordion, Overlay, Scrollbar)
        - Data display (Avatar, Badge, Counter, Indicator, ProgressBar, Spinner, Loader, Skeleton, Image, Icon, Text)
        - Theme tokens / SDDSThemeCore
        - Theme generation (dsbuilder CLI)
        - Build, packaging or release scripts
        - Other
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      description: Exact type name, if the problem is in a specific component.
      placeholder: SDDSTextField
    validations:
      required: false

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - SDDSServTheme
        - PlasmaB2CTheme
        - PlasmaHomeDSTheme
        - Custom theme generated with dsbuilder
        - Not theme-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag and, if you know it, the module version from `release-manifest.json`.
      placeholder: "release-01-09-2026 / SDDSComponents 0.34.0"
    validations:
      required: true

  - type: dropdown
    id: integration
    attributes:
      label: How is it integrated?
      options:
        - XCFramework from a GitHub release
        - Swift Package Manager
        - Standalone sources (dsbuilder --standalone)
        - Local checkout of this repository
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: iOS and Xcode versions
      placeholder: "iOS 18.6 simulator, Xcode 26.6"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally a small SwiftUI view we can paste into the demo app.
      render: swift
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include console output if there is any (`No image named ... found in asset catalog`, `Undefined ... for size ...`).
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Drag and drop images here. Strongly recommended for visual issues.
    validations:
      required: false

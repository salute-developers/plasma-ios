# SwiftLint configuration.
#
# Two things to know before editing:
#  * `excluded` matters. Without it SwiftLint walks generated theme code, vendored sources and
#    SwiftPM checkouts under `.build` — the latter also carry their own nested `.swiftlint.yml`,
#    which is where stray "configuration specified version X" warnings come from.
#  * Most cosmetic rules below are auto-correctable. Run `swiftlint --fix` before fixing by hand.

excluded:
  - Themes                    # generated by dsbuilder, regenerated on every theme build
  - SDDSIcons/Generated       # generated by swiftgen
  - Vendor                    # third-party submodules
  - "**/.build"               # SwiftPM checkouts
  - "**/build"                # xcodebuild artifacts
  - SDDSComponentsFixtures/Sources/SDDSComponentsFixtures/Generated
  - DesignSystemBuilder/SDDSTheme/Sources/SDDSTheme/Generated
  - SDDSDemoApp/SDDSDemoApp/Common/Sandbox/GeneratedStories+Autogen.swift

disabled_rules:
  # Token and appearance code is full of deliberate short names (m, l, xs, r, g, b).
  - identifier_name
  # `isEmpty` vs `count == 0` is not worth churn in this codebase.
  - empty_count

analyzer_rules: # rules run by `swiftlint analyze`
  - explicit_self

# If true, SwiftLint will not fail if no lintable files are found.
allow_zero_lintable_files: false

# If true, SwiftLint will treat all warnings as errors.
strict: false

force_cast: warning
force_try:
  severity: warning

line_length: 190

# Size rules report warnings only — no `error:` level. They flag growth in review without
# blocking CI on the handful of large switch tables in the generator and the sandbox glue.
file_length:
  warning: 800
type_body_length:
  warning: 500
function_body_length:
  warning: 120
cyclomatic_complexity:
  warning: 15

type_name:
  min_length: 4
  max_length:
    warning: 40
    error: 50
  excluded: iPhone
  allowed_symbols: ["_"]

reporter: "xcode"
